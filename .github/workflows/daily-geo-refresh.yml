name: Daily GEO Auto-Refresh
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python3 update_data.py
          python3 build_geo_matrix.py
      - run: |
          git config [invalid URL] "geo-auto-bot"
          git config [invalid URL] "geo-auto-bot@users.noreply.github.com"
          git add data.json llms.txt index.html compare/
          git diff --staged --quiet || (git commit -m "chore(geo): daily refresh $(date -u +%Y-%m-%d)" && git push)
